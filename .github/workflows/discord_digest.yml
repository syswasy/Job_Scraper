name: Discord Job Digest

on:
  schedule:
    # Times are UTC. 12:00 UTC = 8:00 AM in Montréal in summer (7:00 AM in winter)
    #                22:00 UTC = 6:00 PM in Montréal in summer (5:00 PM in winter)
    - cron: "0 12 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      send_existing:
        description: "First run only: announce every job already stored instead of just recording them"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: discord-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Discord digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ "${{ github.event.inputs.send_existing }}" = "true" ]; then
            python discord_digest.py --send-existing
          else
            python discord_digest.py
          fi

      - name: Save what was sent
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          f=$(ls output/discord_sent.json discord_sent.json 2>/dev/null | head -n1 || true)
          if [ -n "$f" ]; then
            git add -f "$f"
            if ! git diff --cached --quiet; then
              git commit -m "chore: update discord digest state"
              for i in 1 2 3; do
                git pull --rebase origin main && git push && break
                sleep 5
              done
            fi
          fi
